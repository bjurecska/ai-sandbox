# =============================================================================
# SBX Network Policy Configuration - claude-modified
# =============================================================================
# Project-specific network policy rules for the Claude Code + Antigravity CLI sandbox.
# Global Docker registry rules are defined in root sbx-policy-global.yaml.
# =============================================================================

version: "1.0"
description: "Project-specific network policy rules for claude sandbox"

rules:
  # ---------------------------------------------------------------------------
  # Claude & Anthropic AI Services
  # ---------------------------------------------------------------------------
  - domain: "claude.ai"
    description: "Claude Web interface"

  - domain: "anthropic.com"
    description: "Anthropic corporate domain & APIs"

  - domain: "claude.com"
    description: "Claude product domain"

  - domain: "*.claude.com"
    description: "Claude subdomains and services"

  - domain: "api.anthropic.com"
    description: "Anthropic Claude Model API endpoint"

  # ---------------------------------------------------------------------------
  # Google & Antigravity Ecosystem
  # ---------------------------------------------------------------------------
  - domain: "google.com"
    description: "Google main domain"

  # ---------------------------------------------------------------------------
  # GitHub & Code Repositories
  # ---------------------------------------------------------------------------
  - domain: "github.com"
    description: "GitHub main repository platform"

  - domain: "*.github.com"
    description: "GitHub subdomains and API services"

  - domain: "*.githubusercontent.com"
    description: "GitHub raw content, CodeGraph scripts, and release assets"

  # ---------------------------------------------------------------------------
  # GitLab & Package Repositories
  # ---------------------------------------------------------------------------
  - domain: "gitlab.com"
    description: "GitLab platform & CLI release permalinks"

  - domain: "*.gitlab.com"
    description: "GitLab subdomains and generic package downloads"

  - domain: "ports.ubuntu.com"
    description: "Ubuntu package repository mirror"
