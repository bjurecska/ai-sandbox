name: Build and Publish Sandbox Images

on:
  push:
    tags:
      - '*'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find projects
        id: set-matrix
        run: |
          dirs=()
          for d in */; do
            if [[ -f "${d}Dockerfile" ]]; then
              dirs+=("${d%/}")
            fi
          done
          # Output as JSON array for the matrix
          echo "projects=$(jq --compact-output --null-input '$ARGS.positional' --args -- "${dirs[@]}")" >> $GITHUB_OUTPUT

  build-and-push:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          PROJECT_NAME: ${{ matrix.project }}
        run: |
          # Lowercase the repository name to adhere to Docker naming conventions
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/$REPO_LOWER"
          
          echo "Processing project: $PROJECT_NAME"
          
          REMOTE_IMAGE_LATEST="${REGISTRY}/${PROJECT_NAME}:latest"
          REMOTE_IMAGE_TAG="${REGISTRY}/${PROJECT_NAME}:${{ github.ref_name }}"
          
          # 1. Build the image using the updated script
          # Use --image-name so the image gets built with the correct GHCR name
          ./build_and_load.sh "$PROJECT_NAME" latest --ci --image-name "${REMOTE_IMAGE_LATEST}"
          
          # 2. Tag and Push the image to GHCR
          # GitHub runners have both buildah and docker. build_and_load.sh uses buildah with vfs if available.
          if command -v buildah >/dev/null 2>&1; then
            echo "Pushing with buildah..."
            sudo buildah --storage-driver vfs push --authfile "${HOME}/.docker/config.json" "${REMOTE_IMAGE_LATEST}" "docker://${REMOTE_IMAGE_LATEST}"
            sudo buildah --storage-driver vfs push --authfile "${HOME}/.docker/config.json" "${REMOTE_IMAGE_LATEST}" "docker://${REMOTE_IMAGE_TAG}"
          else
            echo "Pushing with docker..."
            docker tag "${REMOTE_IMAGE_LATEST}" "${REMOTE_IMAGE_TAG}"
            docker push "${REMOTE_IMAGE_LATEST}"
            docker push "${REMOTE_IMAGE_TAG}"
          fi
